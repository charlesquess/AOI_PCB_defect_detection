# YOLOv5 hyperparameters - PCB Defect Detection
# 6 classes, small defects, P2 detection head, offline orthogonal augmentation

# learning rate & optimizer
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.001

# warmup
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# loss weights
box: 0.10
cls: 0.70
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
label_smoothing: 0.05

# data augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0              # 保留小角度在线仿射，适应轻微放置误差
translate: 0.1
scale: 0.5
shear: 0.0                # 关闭剪切，避免扭曲细小线缆特征
perspective: 0.0
flipud: 0.5               # 提升上下翻转
fliplr: 0.5
mosaic: 0.1               # 已离线裁剪，Mosaic 会二次压碎图，大幅降低
mixup: 0.4                # 特征图融合，提升背景泛化
copy_paste: 0.0
